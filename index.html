<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Помощь с техникой</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#eef4f4;--ink:#11232b;--muted:#4b6169;--line:#c5d5d7;
  --brand:#0f6b63;--on-brand:#ffffff;--accent:#f2b134;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a1f;--ink:#e6f0f1;--muted:#9fb5ba;--line:#28414a;
    --brand:#4fd1c0;--on-brand:#072723;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a1f;--ink:#e6f0f1;--muted:#9fb5ba;--line:#28414a;
  --brand:#4fd1c0;--on-brand:#072723;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:1.0625rem;line-height:1.6}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.25rem 0}
.brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:.6rem}
.brand::before{content:"";width:.9rem;height:.9rem;border-radius:50%;background:var(--accent)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:.2rem}
.lang button{font:inherit;font-weight:600;font-size:.9rem;color:var(--muted);background:none;border:0;
  padding:.4rem .85rem;border-radius:999px;cursor:pointer;min-height:2.5rem}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{padding:3rem 0 3.5rem}
h1{font-size:clamp(2.1rem,6.5vw,4rem);line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:0 0 1.25rem;max-width:18ch}
.lead{font-size:1.2rem;color:var(--muted);max-width:36rem;margin:0 0 2rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;font-weight:600;text-decoration:none;padding:.9rem 1.5rem;border-radius:.6rem;
  border:2px solid var(--brand);min-height:3rem}
.btn.p{background:var(--brand);color:var(--on-brand)}
.btn.s{color:var(--ink);border-color:var(--line)}
section{display:grid;grid-template-columns:1fr;gap:1rem;padding:2.5rem 0;border-top:1.5px solid var(--line)}
h2{font-size:1.5rem;margin:0;font-weight:800}
.list{margin:0;padding:0;list-style:none}
.list li{padding:.9rem 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}
.list strong{display:block;font-size:1.1rem}
.list span{color:var(--muted)}
.price{font-size:2.2rem;font-weight:800;margin:0 0 .25rem}
.note{color:var(--muted);margin:0}
ol.list{counter-reset:s}
ol.list li{counter-increment:s;padding-left:2.5rem;position:relative}
ol.list li::before{content:counter(s);position:absolute;left:0;top:.9rem;width:1.7rem;height:1.7rem;
  border-radius:50%;background:var(--accent);color:#11232b;font-weight:800;font-size:.9rem;
  display:grid;place-items:center}
ol.list li:first-child::before{top:0}
footer{padding:2rem 0 3rem;border-top:1.5px solid var(--line);color:var(--muted)}
@media (min-width:48rem){
  section{grid-template-columns:14rem 1fr;gap:2rem}
  .hero{padding:5rem 0 5.5rem}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" data-i="brand">Помощь с техникой</div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-l="ru">RU</button>
      <button type="button" data-l="lv">LV</button>
      <button type="button" data-l="en">EN</button>
    </div>
  </header>

  <main>
    <div class="hero">
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
      <div class="btns">
        <a class="btn p" id="tg" data-i="tg"></a>
        <a class="btn s" id="mail" data-i="mail"></a>
      </div>
    </div>

    <section>
      <h2 data-i="h_services"></h2>
      <ul class="list">
        <li><strong data-i="s1t"></strong><span data-i="s1d"></span></li>
        <li><strong data-i="s2t"></strong><span data-i="s2d"></span></li>
        <li><strong data-i="s3t"></strong><span data-i="s3d"></span></li>
        <li><strong data-i="s4t"></strong><span data-i="s4d"></span></li>
      </ul>
    </section>

    <section>
      <h2 data-i="h_price"></h2>
      <div>
        <p class="price" data-i="price"></p>
        <p class="note" data-i="price_note"></p>
      </div>
    </section>

    <section>
      <h2 data-i="h_how"></h2>
      <ol class="list">
        <li data-i="st1"></li>
        <li data-i="st2"></li>
        <li data-i="st3"></li>
      </ol>
    </section>
  </main>

  <footer data-i="langs"></footer>
</div>

function setLang(l){
  var d=T[l]||T.ru;
  document.documentElement.lang=l;
  document.title=d.title;
  document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=d[el.getAttribute("data-i")]});
  document.querySelectorAll(".lang button").forEach(function(b){
    b.setAttribute("aria-pressed",b.getAttribute("data-l")===l?"true":"false");
  });
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.getElementById("tg").href=TG;
document.getElementById("tg").target="_blank";
document.getElementById("tg").rel="noopener";
document.getElementById("mail").href=MAIL;
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click",function(){setLang(b.getAttribute("data-l"))});
});
var saved=null;
try{saved=localStorage.getItem("lang")}catch(e){}
var nav=(navigator.language||"ru").slice(0,2).toLowerCase();
setLang(T[saved]?saved:(T[nav]?nav:"ru"));

</html>
